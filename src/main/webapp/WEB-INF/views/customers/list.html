<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customers</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div th:replace="~{fragments/nav :: navigation}"></div><main class="container"><h1>Customers</h1><p th:if="${message}" class="alert alert-success" th:text="${message}"></p><a class="btn btn-primary mb-3" th:href="@{/customers/create}">Add customer</a><table class="table"><thead><tr><th>Name</th><th>Email</th><th>Address</th><th></th></tr></thead><tbody><tr th:each="c : ${customers}"><td th:text="${c.name}"></td><td th:text="${c.email}"></td><td th:text="${c.address}"></td><td class="d-flex gap-2"><a class="btn btn-sm btn-outline-primary" th:href="@{/customers/{id}/edit(id=${c.id})}">Edit</a><form th:action="@{/customers/{id}/delete(id=${c.id})}" method="post"><button class="btn btn-sm btn-outline-danger">Delete</button></form></td></tr></tbody></table></main></body></html>
