<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Customer</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div th:replace="~{fragments/nav :: navigation}"></div><main class="container" style="max-width:700px"><h1 th:text="${customer.id == null ? 'New customer' : 'Edit customer'}"></h1><form th:action="@{/customers/save}" th:object="${customer}" method="post" class="vstack gap-3"><input type="hidden" th:field="*{id}"><label>Name<input class="form-control" th:field="*{name}" required maxlength="255"></label><label>Email<input class="form-control" type="email" th:field="*{email}"></label><label>Address<input class="form-control" th:field="*{address}"></label><button class="btn btn-primary">Save</button></form></main></body></html>
