<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${blog.title}"></title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div th:replace="~{fragments/nav :: navigation}"></div><main class="container" style="max-width:900px"><h1 th:text="${blog.title}"></h1><p class="text-secondary" th:text="${#temporals.format(blog.createdAt,'yyyy-MM-dd HH:mm')}"></p><p style="white-space:pre-wrap" th:text="${blog.content}"></p><a class="btn btn-outline-primary" th:href="@{/blogs/{id}/edit(id=${blog.id})}">Edit</a><form class="d-inline" th:action="@{/blogs/{id}/delete(id=${blog.id})}" method="post"><button class="btn btn-outline-danger">Delete</button></form><a class="btn btn-link" th:href="@{/blogs}">Back</a></main></body></html>
