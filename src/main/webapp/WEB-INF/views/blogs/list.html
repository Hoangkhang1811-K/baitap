<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Blogs</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div th:replace="~{fragments/nav :: navigation}"></div><main class="container"><h1>Blog</h1><p th:if="${message}" class="alert alert-success" th:text="${message}"></p><a class="btn btn-primary mb-3" th:href="@{/blogs/create}">Write a post</a><article class="card mb-3" th:each="b : ${blogs}"><div class="card-body"><h2 class="h4"><a th:href="@{/blogs/{id}(id=${b.id})}" th:text="${b.title}"></a></h2><small class="text-secondary" th:text="${#temporals.format(b.createdAt,'yyyy-MM-dd HH:mm')}"></small><p class="mt-2" th:text="${#strings.abbreviate(b.content,240)}"></p><a th:href="@{/blogs/{id}(id=${b.id})}">Read</a></div></article><p th:if="${#lists.isEmpty(blogs)}">No posts yet.</p></main></body></html>
