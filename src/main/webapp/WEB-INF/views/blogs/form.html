<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Write blog</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div th:replace="~{fragments/nav :: navigation}"></div><main class="container" style="max-width:900px"><h1 th:text="${blog.id == null ? 'New blog post' : 'Edit blog post'}"></h1><form th:action="@{/blogs/save}" th:object="${blog}" method="post" class="vstack gap-3"><input type="hidden" th:field="*{id}"><input type="hidden" th:field="*{createdAt}"><label>Title<input class="form-control" th:field="*{title}" required maxlength="255"></label><label>Content<textarea class="form-control" th:field="*{content}" rows="14" required></textarea></label><button class="btn btn-primary">Save</button></form></main></body></html>
