<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Upload product</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body><div th:replace="~{fragments/nav :: navigation}"></div><main class="container" style="max-width:700px"><h1>Upload product</h1><form th:action="@{/products/save}" th:object="${productForm}" method="post" enctype="multipart/form-data" class="vstack gap-3"><input type="hidden" th:field="*{id}"><label>Name<input class="form-control" th:field="*{name}" required maxlength="255"></label><label>Description<textarea class="form-control" th:field="*{description}" rows="4"></textarea></label><label>Image<input class="form-control" type="file" th:field="*{image}" accept="image/jpeg,image/png,image/gif,image/webp"></label><button class="btn btn-primary">Save</button><a th:href="@{/products}">Back</a></form></main></body></html>
