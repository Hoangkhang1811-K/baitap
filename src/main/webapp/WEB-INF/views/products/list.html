<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Thư viện ảnh</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><style>.stars{color:#f0ad00;font-size:1.25rem}</style></head><body><div th:replace="~{fragments/nav :: navigation}"></div><main class="container"><div class="d-flex justify-content-between align-items-center mb-3"><h1>Thư viện ảnh</h1><a class="btn btn-primary" th:href="@{/products/create}">Thêm ảnh</a></div><p th:if="${message}" class="alert alert-success" th:text="${message}"></p><div class="alert alert-info" th:if="${#lists.isEmpty(products)}">Chưa có ảnh. Hãy thêm ảnh đầu tiên của bạn.</div><div class="row g-3"><div class="col-md-4" th:each="p : ${products}"><div class="card h-100"><img th:if="${p.image}" th:src="@{/image/{name}(name=${p.image})}" class="card-img-top" style="height:240px;object-fit:cover" alt="Ảnh được tải lên"><div class="card-body"><h5 th:text="${p.name}"></h5><p th:if="${p.description}" th:text="${p.description}"></p><div class="mb-2"><span class="stars" th:text="${p.ratingCount == 0 ? '☆☆☆☆☆' : (#numbers.formatDecimal(p.averageRating, 1, 1) + ' / 5')} "></span><small class="text-secondary" th:text="${'(' + p.ratingCount + ' lượt đánh giá)'}"></small></div><form method="post" class="d-flex align-items-center gap-2" th:action="@{/products/{id}/rate(id=${p.id})}"><label class="form-label mb-0" th:for="${'rating-' + p.id}">Đánh giá</label><select class="form-select form-select-sm" style="max-width:100px" name="rating" th:id="${'rating-' + p.id}"><option value="5">5 sao</option><option value="4">4 sao</option><option value="3">3 sao</option><option value="2">2 sao</option><option value="1">1 sao</option></select><button class="btn btn-sm btn-outline-primary">Gửi</button></form></div></div></div></div></main></body></html>
