<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NASA - Bức ảnh của ngày</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body><div th:replace="~{fragments/nav :: navigation}"></div>
<main class="container" style="max-width:960px"><h1>Bức ảnh của ngày</h1>
  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
  <div class="alert alert-success" th:if="${feedbackMessage}" th:text="${feedbackMessage}"></div>
  <div class="alert alert-warning" th:if="${feedbackError}" th:text="${feedbackError}"></div>
  <article th:if="${imageUrl}"><h2 class="h4" th:text="${title}"></h2><p class="text-secondary" th:text="${date}"></p>
    <img class="img-fluid rounded" th:src="${imageUrl}" th:alt="${title}">
    <p class="mt-3" th:text="${explanation}"></p><small class="text-secondary" th:text="${credit}"></small>
    <hr class="my-4">
    <section aria-labelledby="rating-heading" class="mb-4">
      <h2 id="rating-heading" class="h4">Đánh giá bức ảnh</h2>
      <p>Điểm trung bình: <strong th:text="${#numbers.formatDecimal(apodImage.averageRating, 1, 1)}">0.0</strong>/5
        (<span th:text="${apodImage.ratingCount}">0</span> lượt đánh giá)</p>
      <form th:action="@{/apod/rate}" method="post" class="d-flex gap-2 align-items-center">
        <input type="hidden" name="date" th:value="${date}">
        <label for="rating" class="form-label mb-0">Chọn số sao</label>
        <select class="form-select" id="rating" name="rating" required style="max-width:120px">
          <option value="5">5 sao</option><option value="4">4 sao</option><option value="3">3 sao</option><option value="2">2 sao</option><option value="1">1 sao</option>
        </select>
        <button class="btn btn-primary" type="submit">Gửi đánh giá</button>
      </form>
    </section>
    <section aria-labelledby="comments-heading" class="mb-5">
      <h2 id="comments-heading" class="h4">Bình luận</h2>
      <form th:action="@{/apod/comment}" method="post" class="mb-4">
        <input type="hidden" name="date" th:value="${date}">
        <div class="mb-2"><label class="form-label" for="author">Tên của bạn</label><input class="form-control" id="author" name="author" maxlength="80" required></div>
        <div class="mb-2"><label class="form-label" for="content">Nội dung</label><textarea class="form-control" id="content" name="content" rows="3" maxlength="1000" required></textarea></div>
        <button class="btn btn-outline-primary" type="submit">Đăng bình luận</button>
      </form>
      <p class="text-secondary" th:if="${#lists.isEmpty(comments)}">Chưa có bình luận nào. Hãy chia sẻ cảm nhận của bạn.</p>
      <article class="border rounded p-3 mb-2" th:each="comment : ${comments}">
        <div class="d-flex justify-content-between gap-3"><strong th:text="${comment.author}">Tên</strong><time class="text-secondary" th:text="${#temporals.format(comment.createdAt, 'dd/MM/yyyy HH:mm')}">Thời gian</time></div>
        <p class="mb-0 mt-2" style="white-space:pre-wrap" th:text="${comment.content}">Nội dung</p>
      </article>
    </section>
  </article>
</main></body></html>
