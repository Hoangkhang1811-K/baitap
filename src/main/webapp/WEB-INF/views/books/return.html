<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trả sách</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5" style="max-width:600px"><a th:href="@{/books}">← Về thư viện</a><section class="card mt-3"><div class="card-body"><h1 class="h3">Trả sách</h1><p>Nhập mã mượn gồm 5 chữ số được cấp khi mượn.</p><form th:action="@{/books/return}" method="post"><label class="form-label" for="code">Mã mượn</label><input class="form-control mb-3" id="code" name="code" inputmode="numeric" pattern="[0-9]{5}" maxlength="5" required><button class="btn btn-primary">Xác nhận trả sách</button></form></div></section></main></body></html>
