<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Thư viện sách</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1>Thư viện sách</h1><p class="text-muted mb-0">Chọn đầu sách để xem chi tiết và mượn.</p></div><a class="btn btn-outline-primary" th:href="@{/books/return}">Trả sách</a></div>
<div class="alert alert-success" th:if="${message}" th:text="${message}"></div><div class="row g-3"><div class="col-md-6 col-lg-4" th:each="book : ${books}"><section class="card h-100 shadow-sm"><div class="card-body"><h2 class="h5" th:text="${book.title}">Tên sách</h2><p class="text-muted" th:text="${book.author}">Tác giả</p><p>Còn <strong th:text="${book.availableCopies}">0</strong> cuốn</p><a class="btn btn-primary" th:href="@{/books/{id}(id=${book.id})}">Chi tiết</a></div></section></div></div></main></body></html>
