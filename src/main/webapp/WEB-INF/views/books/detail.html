<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chi tiết sách</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container py-5"><a th:href="@{/books}">← Danh sách sách</a><section class="card mt-3"><div class="card-body"><h1 class="h3" th:text="${book.title}">Tên sách</h1><p>Tác giả: <span th:text="${book.author}"></span></p><p>Số lượng còn lại: <strong th:text="${book.availableCopies}"></strong></p><form th:action="@{/books/{id}/borrow(id=${book.id})}" method="post"><button class="btn btn-primary" th:disabled="${book.availableCopies == 0}">Mượn sách</button></form><p class="text-danger mt-3" th:if="${book.availableCopies == 0}">Sách hiện đã được mượn hết.</p></div></section></main></body></html>
