<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thư viện nhạc</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body><div th:replace="~{fragments/nav :: navigation}"></div>
<main class="container"><div class="d-flex justify-content-between align-items-center mb-3"><h1>Thư viện nhạc</h1><a class="btn btn-primary" th:href="@{/songs/create}">Thêm bài hát</a></div>
  <div class="alert alert-success" th:if="${message}" th:text="${message}"></div>
  <div class="alert alert-info" th:if="${#lists.isEmpty(songs)}">Chưa có bài hát. Hãy thêm file MP3, WAV, OGG, M4A hoặc AAC.</div>
  <div class="table-responsive"><table class="table table-striped align-middle" th:if="${!#lists.isEmpty(songs)}"><thead><tr><th>Tên bài hát</th><th>Nghệ sĩ</th><th>Thể loại</th><th>Nghe</th><th>Thao tác</th></tr></thead>
    <tbody><tr th:each="song : ${songs}"><td th:text="${song.title}"></td><td th:text="${song.artist}"></td><td th:text="${song.genre}"></td>
      <td><audio controls preload="none"><source th:src="@{/audio/{file}(file=${song.filePath})}"></audio></td>
      <td class="text-nowrap"><a class="btn btn-sm btn-outline-primary" th:href="@{/songs/{id}/edit(id=${song.id})}">Sửa</a>
        <form class="d-inline" method="post" th:action="@{/songs/{id}/delete(id=${song.id})}" onsubmit="return confirm('Xoá bài hát này?')"><button class="btn btn-sm btn-outline-danger">Xoá</button></form></td>
    </tr></tbody></table></div>
</main></body></html>
