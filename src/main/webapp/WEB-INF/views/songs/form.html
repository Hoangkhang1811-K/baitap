<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bài hát</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head><body><div th:replace="~{fragments/nav :: navigation}"></div>
<main class="container" style="max-width:720px"><h1 th:text="${songForm.id == null ? 'Thêm bài hát' : 'Cập nhật bài hát'}"></h1>
  <form method="post" enctype="multipart/form-data" th:action="@{/songs/save}" th:object="${songForm}" class="mt-4">
    <input type="hidden" th:field="*{id}">
    <div class="mb-3"><label class="form-label" for="title">Tên bài hát</label><input class="form-control" id="title" th:field="*{title}" required maxlength="255"></div>
    <div class="mb-3"><label class="form-label" for="artist">Nghệ sĩ</label><input class="form-control" id="artist" th:field="*{artist}" required maxlength="255"></div>
    <div class="mb-3"><label class="form-label" for="genre">Thể loại</label><input class="form-control" id="genre" th:field="*{genre}" required maxlength="255"></div>
    <div class="mb-3"><label class="form-label" for="audioFile">File nhạc</label><input class="form-control" id="audioFile" type="file" th:field="*{audioFile}" accept=".mp3,.wav,.ogg,.m4a,.aac" th:required="${songForm.id == null}">
      <div class="form-text">Định dạng MP3, WAV, OGG, M4A hoặc AAC. Khi sửa, bỏ trống để giữ file hiện tại.</div></div>
    <button class="btn btn-primary">Lưu</button><a class="btn btn-outline-secondary" th:href="@{/songs}">Quay lại</a>
  </form></main></body></html>
