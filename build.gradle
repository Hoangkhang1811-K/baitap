plugins {
    id 'java'
    id 'war'
}

group = 'com.codegym'
version = '1.0.0'

java { toolchain { languageVersion = JavaLanguageVersion.of(17) } }
repositories { mavenCentral() }

dependencies {
    compileOnly 'jakarta.servlet:jakarta.servlet-api:6.0.0'
    implementation 'org.springframework:spring-webmvc:6.2.6'
    implementation 'org.springframework:spring-orm:6.2.6'
    implementation 'org.springframework:spring-jdbc:6.2.6'
    implementation 'org.springframework:spring-aop:6.2.6'
    implementation 'org.aspectj:aspectjweaver:1.9.22.1'
    implementation 'org.thymeleaf:thymeleaf-spring6:3.1.3.RELEASE'
    implementation 'nz.net.ultraq.thymeleaf:thymeleaf-layout-dialect:3.3.0'
    implementation 'org.hibernate.orm:hibernate-core:6.6.13.Final'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    implementation 'org.jsoup:jsoup:1.18.3'
    implementation 'com.mysql:mysql-connector-j:9.2.0'
    runtimeOnly 'com.h2database:h2:2.3.232'
    implementation 'jakarta.transaction:jakarta.transaction-api:2.0.1'
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += '-parameters'
}
test { useJUnitPlatform() }
war { archiveFileName = 'lesson4-5-6.war' }
